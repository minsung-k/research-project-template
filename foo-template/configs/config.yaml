# configs/config.yaml
# Top-level config. Sub-configs are composed via the `defaults` list.
# Override any field at the CLI:  python scripts/train.py model=fno lr=1e-4

defaults:
  - _self_
  - model: mlp
  - dataset: cylinder
  - optimizer: adamw
  - trainer: default
  - override hydra/job_logging: default

# Run identity
exp_name: default
seed: 0
notes: ""    # free text, gets logged to W&B

# Hydra controls where outputs go.
# We send them to /scratch via the FOO_RUNS_DIR env var (set by setup_env.sh).
hydra:
  run:
    dir: ${oc.env:FOO_RUNS_DIR}/${exp_name}/${now:%Y-%m-%d}_${oc.env:USER}_${exp_name}_seed${seed}
  sweep:
    dir: ${oc.env:FOO_RUNS_DIR}/sweeps/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false   # don't cd into the run dir; we manage paths explicitly
