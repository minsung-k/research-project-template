[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foo"
version = "0.0.1"
description = "Short one-line description of this project"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    # Config / experiment management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # Logging
    "wandb>=0.17",
    # Data + utilities
    "pandas>=2.1",
    "tqdm>=4.66",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipython>=8.0",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length is handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
