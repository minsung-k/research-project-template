# configs/experiment/ablation_v1.yaml
# Named experiment: a specific composition of overrides.
# Run with:  python scripts/train.py +experiment=ablation_v1
#
# Sweeps via -m (multirun):
#   python scripts/train.py -m +experiment=ablation_v1 seed=0,1,2 model.hidden_dims=[64,64],[128,128]
# This generates a 6-run grid in ${FOO_RUNS_DIR}/sweeps/...

# @package _global_
defaults:
  - override /model: mlp
  - override /optimizer: adamw

exp_name: ablation_v1
seed: 0

model:
  hidden_dims: [256, 256, 256]

optimizer:
  lr: 3.0e-4

trainer:
  max_epochs: 200
